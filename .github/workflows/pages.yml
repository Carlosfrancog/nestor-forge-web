name: Publicar Nestor Forge no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Empacotar AgentOrchestra
        run: |
          npm ci --prefix vscode-extension
          python -m unittest discover -s vscode-extension/test -p '*share*.py'
          version=$(node -p "require('./vscode-extension/package.json').version")
          cd vscode-extension
          npx --yes @vscode/vsce package --out "../dist/agentorchestra-$version.vsix"
      - name: Montar site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
